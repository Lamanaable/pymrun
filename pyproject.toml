[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[project]
name = "pymrun"
version = "1.0.0"
description = "Fuzzy Python module runner for uv"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["click>=8.0"]

[project.scripts]
pymrun = "pymrun.cli:main"

[project.optional-dependencies]
build = ["uv"]

[dependency-groups]
dev = ["pytest", "tox", "tox-uv", "build"]
lint = ["ruff", "pyright"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.9"
include = ["pymrun"]
strict = ["pymrun"]
venvPath = "."
venv = ".venv"

[tool.uv.build-backend]
module-name = "pymrun"
module-root = ""

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): bump version to {version}"
build_command = """
    uv pip install -e '.[build]'
    uv build
"""
