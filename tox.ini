[tox]
envlist = lint, py39, py310, py311, py312, py313, py314, pypy310
isolated_build = true

[testenv]
runner = uv-venv-runner
deps = pytest
setenv =
    UV_CACHE_DIR = {envtmpdir}/.cache/uv
commands = pytest {posargs}

[testenv:lint]
runner = uv-venv-runner
deps =
    ruff
    pyright
    click>=8.0
setenv =
    UV_CACHE_DIR = {envtmpdir}/.cache/uv
commands =
    ruff check .
    ruff format --check .
    pyright
